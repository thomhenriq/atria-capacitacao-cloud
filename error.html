<!doctype html>
<html lang="pt-BR" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Perdido nas nuvens | Atria Cloud</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e0a15">
  <!-- Caminhos absolutos: o S3 entrega esta página para qualquer URL inexistente, inclusive em subpastas. -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <canvas class="sky" id="sky" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>

  <main class="lost">
    <div>
      <svg class="lost__cloud" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="lost-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#d4ceff"/>
            <stop offset="1" stop-color="#7a6bd0"/>
          </linearGradient>
        </defs>
        <path d="M9 24h14.5a5.5 5.5 0 0 0 .6-10.97A7.5 7.5 0 0 0 9.6 14.1 5 5 0 0 0 9 24z" fill="url(#lost-grad)"/>
        <circle cx="13.5" cy="18" r="1" fill="#17121e"/>
        <circle cx="19.5" cy="18" r="1" fill="#17121e"/>
        <path d="M14.5 21.6c1.2-.9 2.8-.9 4 0" stroke="#17121e" stroke-width=".9" fill="none" stroke-linecap="round"/>
      </svg>
      <p class="lost__code gradient-text">404</p>
      <h1 class="lost__title">Perdido nas nuvens</h1>
      <p>
        Essa página não existe neste bucket. Quem te trouxe até aqui foi o
        <code>error.html</code>, configurado como <em>error document</em> no
        static website hosting do S3.
      </p>
      <a class="btn btn--primary" href="/">Voltar pra Atria Cloud</a>
    </div>
  </main>

  <script src="/assets/main.js" defer></script>
</body>
</html>
